<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Storage Pokemon</title>
</head>

<body>

    <head>
        <!-- Vincular CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="contenedor">
            <div class="columna">

                <img src="pokem.png" alt="Web Storage Pokemon">

                <!-- Sección de búsqueda -->
                <input type="text" id="pokemonInput" placeholder="Escribe un Pokémon...">
                <button onclick="searchPokemon()">Buscar</button>

                <!-- Resultado del Pokémon -->
                <div id="resultado"></div>

                <!-- Botón para guardar favoritos -->
                <button onclick="saveFavorite()">Guardar como Favorito</button>
            </div>

            <div class="columna">
                <h2>Mis Pokemon Favoritos</h2>
                <div id="favoritos"></div>
            </div>

        </div>

        <!-- Archivo JavaScript -->
        <script src="script.js"></script>


    </body>

</html>
